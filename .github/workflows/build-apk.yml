name: Build GMAX IPTV (Android APK & iOS IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Get Flutter Dependencies
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gmax-iptv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gmax-iptv-android-apk
          path: gmax-iptv.apk
          retention-days: 30

      - name: Publish Android APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GMAX IPTV v1.0.0 — نسخ أندرويد (APK) وآيفون (IPA)"
          body: |
            ### تحميل مباشر للهاتف:
            - **أندرويد (Android):** اضغط على **`gmax-iptv.apk`** لتثبيته مباشرة على هاتفك.
            - **آيفون (iOS):** اضغط على **`gmax-iptv-ios.ipa`** لتثبيته عبر Sideloadly أو AltStore أو ESign.
          files: gmax-iptv.apk
          prerelease: false

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Get Flutter Dependencies
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry gmax-iptv-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: gmax-iptv-ios-ipa
          path: gmax-iptv-ios.ipa
          retention-days: 30

      - name: Publish iOS IPA to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GMAX IPTV v1.0.0 — نسخ أندرويد (APK) وآيفون (IPA)"
          files: gmax-iptv-ios.ipa
          prerelease: false
