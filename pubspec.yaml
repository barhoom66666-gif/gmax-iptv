name: mbark_iptv
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluent_ui: ^4.11.2
  system_theme: ^3.1.2
  fluttertoast: ^8.2.12
  responsive_framework: ^1.5.1
  getwidget: ^6.0.0
  loading_animation_widget: ^1.3.0
  azul_envato_checker: ^0.0.10+10
  font_awesome_flutter: ^10.8.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  flutter_native_splash: ^2.4.5
  window_manager: ^0.4.3


  #Logic
  go_router: ^14.8.0
  flutter_bloc: ^9.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  universal_platform: ^1.1.0

  #Locle
  sqflite: ^2.4.2
  path: ^1.9.1
  sqflite_common_ffi: ^2.3.5

  #Http
  dio: ^5.8.0+1
  in_app_review: ^2.0.10
  share_plus: ^10.1.4

  #Ads
  google_mobile_ads: ^5.3.1

  #Youtube
  youtube_player_flutter: ^9.1.1


  #PLAYERS
  media_kit: ^1.1.11
  media_kit_native_event_loop: ^1.0.9
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.10


dependency_overrides:
  win32: ^5.11.0
  js: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3



flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/fonts/nunitosans/

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/nunitosans/Nunito-Black.ttf
        - asset: assets/fonts/nunitosans/Nunito-BlackItalic.ttf
        - asset: assets/fonts/nunitosans/Nunito-Bold.ttf
        - asset: assets/fonts/nunitosans/Nunito-BoldItalic.ttf
        - asset: assets/fonts/nunitosans/Nunito-ExtraBold.ttf
        - asset: assets/fonts/nunitosans/Nunito-ExtraBoldItalic.ttf
        - asset: assets/fonts/nunitosans/Nunito-ExtraLight.ttf
        - asset: assets/fonts/nunitosans/Nunito-ExtraLightItalic.ttf
        - asset: assets/fonts/nunitosans/Nunito-Italic.ttf
        - asset: assets/fonts/nunitosans/Nunito-Light.ttf
        - asset: assets/fonts/nunitosans/Nunito-LightItalic.ttf
        - asset: assets/fonts/nunitosans/Nunito-Medium.ttf
        - asset: assets/fonts/nunitosans/Nunito-MediumItalic.ttf
        - asset: assets/fonts/nunitosans/Nunito-Regular.ttf
        - asset: assets/fonts/nunitosans/Nunito-SemiBold.ttf
        - asset: assets/fonts/nunitosans/Nunito-SemiBoldItalic.ttf



flutter_native_splash:
  color: "#161514"
  image: assets/images/icon.png


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#161514"
    theme_color: "#161514"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true
      - name: Get Flutter Dependencies
        run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release --no-tree-shake-icons
      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath gmax-iptv-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gmax-iptv-windows
          path: gmax-iptv-windows.zip
          retention-days: 30
      - name: Publish Windows ZIP to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: gmax-iptv-windows.zip
          prerelease: false
          
  macos:
    generate: true
    image_path: "assets/images/icon.png"
